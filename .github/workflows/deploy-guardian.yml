name: 🛡️ Deploy Guardian

on:
  push:
  pull_request:

concurrency:
  group: deploy-guardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-cadastro:
    name: E2E /cadastro (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: ovile_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Postgres descartável do CI — o build roda `prisma db push` contra ele
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/ovile_e2e
      AUTH_SECRET: e2e-only-secret-nao-usado-em-prod
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: dummy.apps.googleusercontent.com
      AUTH_GOOGLE_SECRET: dummy
      APP_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Build (prisma db push cria o schema no Postgres do CI)
        run: npm run build

      - name: Seed Campaign do tenant fallback
        run: |
          psql "$DATABASE_URL" -c "INSERT INTO \"Campaign\" (id, name, plan, active, \"createdAt\", \"updatedAt\") VALUES ('andre-santos-2026', 'Base de Apoio André Santos', 'free', true, now(), now()) ON CONFLICT (id) DO NOTHING;"

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  check-and-heal:
    name: Check & Auto-Heal
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint, typecheck, build in parallel
        id: checks
        run: |
          # set +e: o objetivo deste step é CAPTURAR exit codes, não falhar.
          # Sem isso, o set -e padrão do Actions mata o step na primeira
          # substituição que falha (era por isso que o job ficava vermelho
          # em todo push: o tsc esbarra nos 23 type-errors conhecidos).
          set +e
          lint_out=$(npm run lint 2>&1); lint_code=$?
          tsc_out=$(npx tsc --noEmit 2>&1); tsc_code=$?
          build_out=$(npm run build 2>&1); build_code=$?

          echo "lint_ok=$([ $lint_code -eq 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "tsc_ok=$([ $tsc_code -eq 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "build_ok=$([ $build_code -eq 0 ] && echo true || echo false)" >> $GITHUB_OUTPUT

          # tsc é INFORMATIVO (dívida de 23 type-errors mapeada em
          # .claude/estado.md Sprint 24; ignoreBuildErrors mantida de propósito).
          # Só lint e build bloqueiam/acionam auto-heal.
          has_errors=false
          [ $lint_code -ne 0 ] && has_errors=true
          [ $build_code -ne 0 ] && has_errors=true
          echo "has_errors=$has_errors" >> $GITHUB_OUTPUT
          [ $tsc_code -ne 0 ] && echo "::warning::tsc --noEmit com erros (não bloqueante — dívida mapeada em .claude/estado.md)"

          # Store error output for Claude
          {
            echo "## Current Errors"
            echo ""
            echo "### Lint (exit code: $lint_code)"
            echo '```'
            echo "$lint_out" | tail -50
            echo '```'
            echo ""
            echo "### TypeScript (exit code: $tsc_code)"
            echo '```'
            echo "$tsc_out" | tail -50
            echo '```'
            echo ""
            echo "### Build (exit code: $build_code)"
            echo '```'
            echo "$build_out" | tail -80
            echo '```'
          } > /tmp/error-report.md

      - name: Auto-heal with Claude
        if: steps.checks.outputs.has_errors == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code@latest

          # Combine guardian prompt with actual errors
          cat .github/deploy-guardian-prompt.md /tmp/error-report.md > /tmp/full-prompt.md

          claude \
            --print "$(cat /tmp/full-prompt.md)" \
            --max-turns 20 \
            --allowedTools "Edit,Bash,Read,Glob,Grep"

          # Commit any fixes Claude made
          git config user.name "Deploy Guardian"
          git config user.email "deploy-guardian@github-actions"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "fix: deploy guardian auto-heal [skip ci]"
            git push
          fi

      - name: Final verification
        run: |
          echo "▶ lint…"
          npm run lint

          echo "▶ typecheck (informativo — não bloqueia)…"
          npx tsc --noEmit || echo "::warning::tsc --noEmit com erros (não bloqueante — ver .claude/estado.md Sprint 24)"

          echo "▶ build…"
          npm run build

      - name: Check for TODO/console.log in changed files
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD 2>/dev/null)
          if [ -z "$changed" ]; then exit 0; fi

          echo "Checking changed files for TODO and console.log..."
          found=false
          for f in $changed; do
            [ -f "$f" ] || continue
            matches=$(grep -n "TODO\|console\.log" "$f" 2>/dev/null || true)
            if [ -n "$matches" ]; then
              echo "⚠️  $f:"
              echo "$matches"
              found=true
            fi
          done
          if [ "$found" = true ]; then
            echo "::warning::TODO or console.log found in changed files (see above)"
          else
            echo "✅ No TODO or console.log found"
          fi

      - name: Check env var references in changed files
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD 2>/dev/null)
          if [ -z "$changed" ]; then exit 0; fi

          echo "Checking env vars referenced in changed files..."
          for f in $changed; do
            [ -f "$f" ] || continue
            grep -oP 'process\.env\.\K[A-Z_]+' "$f" 2>/dev/null || true
          done | sort -u | while read var; do
            if [ -z "$var" ]; then continue; fi
            # Note: can't check Vercel env in CI without vercel CLI + token
            # Just list them so the developer is aware
            echo "📋 process.env.$var (verify this exists in Vercel)"
          done
