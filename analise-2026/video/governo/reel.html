<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ovile Diagnóstico · Como fica o governo</title>
<!-- Reels 9:16, 96 s: "Como fica o governo a partir de 2027" — governabilidade pelas bancadas eleitas em 2026.
     Capítulo Brasil (8–64 s): 1º turno, Câmara, centro, Senado, cenários do 2º turno. Capítulo Paraná (64–88 s): Moro e a ALEP.
     Cenas a cada 8 s, na trilha trilha-governo.wav (90 BPM). Números em dados.js (gerado por dados.mjs).
     Linha do tempo pausada: window.__seek(t) (../renderizar.mjs grava 30 fps); ?play toca em tempo real. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="dados.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@500;700&display=swap">
<style>
  :root { --laranja: #ff6a13; --fundo: #07090f; --texto: #f2f5fa; --suave: #8b97ad; --cartao: #141a26; --borda: #2a3446;
    --azul: rgb(47,111,255); --verm: rgb(229,49,47); --centro: #6b7690; --psd: #f5a623; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fundo); font-family: "Geist", -apple-system, Arial, sans-serif; color: var(--texto); }
  #palco { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .brilho { position: absolute; border-radius: 50%; filter: blur(160px); }
  #b1 { width: 900px; height: 900px; background: #ff6a13; left: -320px; top: 1150px; opacity: .32; }
  #b2 { width: 760px; height: 760px; background: #2f6fff; right: -300px; top: 200px; opacity: .22; }
  #grade { position: absolute; inset: -200px; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 72px 72px; }
  #varredura { position: absolute; left: -400px; top: 0; width: 300px; height: 1920px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); transform: skewX(-12deg); }
  .k { color: var(--laranja); } .az { color: var(--azul); } .vm { color: var(--verm); } .ps { color: var(--psd); }
  .abs { position: absolute; left: 70px; right: 70px; }
  .cena { position: absolute; inset: 0; }
  .rotulo { font: 600 30px "Geist Mono", monospace; letter-spacing: 6px; color: var(--suave); text-transform: uppercase; text-align: center; }
  .titulo { font-size: 88px; line-height: 1.04; font-weight: 750; letter-spacing: -2.6px; text-align: center; }
  .titulo .linha { display: block; overflow: hidden; padding-bottom: 8px; }
  .titulo .p { display: inline-block; }
  .sub { font-size: 40px; line-height: 1.3; color: #c8d0de; text-align: center; }
  .sub b { color: var(--texto); }
  .fonte { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font: 500 24px "Geist Mono", monospace; color: #5d6880; letter-spacing: 1px; }

  /* capítulo */
  .cap { position: absolute; left: 0; right: 0; top: 760px; text-align: center; }
  .cap small { display: block; font: 700 30px "Geist Mono", monospace; letter-spacing: 10px; color: var(--laranja); }
  .cap b { display: block; font-size: 230px; font-weight: 800; letter-spacing: -6px; line-height: 1; margin-top: 18px; }
  .cap i { display: block; height: 6px; width: 520px; margin: 40px auto 0; background: linear-gradient(90deg, transparent, var(--laranja), transparent); transform-origin: 50% 50%; }

  /* barras de porcentagem */
  .bar { margin-top: 64px; }
  .bar .cab { display: flex; justify-content: space-between; align-items: baseline; font-size: 44px; font-weight: 650; margin-bottom: 18px; }
  .bar .cab b { font: 700 64px "Geist Mono", monospace; letter-spacing: -2px; }
  .bar .cab small { display: block; font-size: 28px; color: var(--suave); font-weight: 400; margin-top: 4px; }
  .bar .trilho { height: 70px; border-radius: 35px; background: var(--cartao); border: 1px solid var(--borda); overflow: hidden; }
  .bar .enche { height: 100%; width: 0; border-radius: 35px; }

  /* hemiciclo */
  .hemi { position: absolute; left: 40px; top: 640px; width: 1000px; height: 560px; overflow: visible; }
  .legenda { position: absolute; left: 60px; right: 60px; display: flex; flex-wrap: wrap; gap: 18px 40px; justify-content: center; font-size: 34px; }
  .legenda span { display: inline-flex; align-items: center; gap: 14px; }
  .legenda i { width: 28px; height: 28px; border-radius: 50%; display: inline-block; }
  .legenda b { font-family: "Geist Mono", monospace; font-size: 40px; }
  .marca line { stroke: #fff; stroke-width: 4; stroke-dasharray: 10 10; }
  .marca text { fill: #fff; font: 700 30px "Geist Mono", monospace; text-anchor: middle; }

  /* lista com barras */
  .lin { display: grid; grid-template-columns: 1fr 120px; align-items: center; gap: 10px 24px; margin-top: 34px; font-size: 38px; }
  .lin .t { grid-column: 1 / -1; height: 26px; border-radius: 13px; background: var(--cartao); overflow: hidden; }
  .lin .t i { display: block; height: 100%; width: 0; border-radius: 13px; background: var(--centro); }
  .lin b { font: 700 44px "Geist Mono", monospace; text-align: right; }
  .lin small { font-size: 26px; color: var(--suave); display: block; }

  /* medidor de cenário */
  .med { margin-top: 130px; }
  .med .cab { display: flex; justify-content: space-between; align-items: baseline; font-size: 52px; font-weight: 650; margin-bottom: 18px; }
  .med .cab span small { display: block; font-size: 32px; color: var(--suave); font-weight: 400; margin-top: 4px; }
  .med .trilho { position: relative; height: 110px; border-radius: 18px; background: var(--cartao); border: 1px solid var(--borda); overflow: hidden; }
  .med .base { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
  .med .falta { position: absolute; top: 0; bottom: 0; width: 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.22) 0 14px, rgba(255,255,255,.06) 14px 28px); }
  .med .meta { position: absolute; top: -10px; bottom: -10px; width: 4px; background: #fff; }
  .med .nums { display: flex; justify-content: space-between; margin-top: 18px; font: 600 34px "Geist Mono", monospace; color: var(--suave); }
  .med .nums b { color: var(--texto); }
  .faltam { font: 800 64px "Geist", sans-serif; letter-spacing: -1px; }
  .cenario { position: absolute; left: 0; right: 0; top: 250px; text-align: center; }
  .cenario small { display: block; font: 700 30px "Geist Mono", monospace; letter-spacing: 8px; color: var(--suave); }
  .cenario b { display: block; font-size: 100px; font-weight: 800; letter-spacing: -3px; margin-top: 14px; }

  /* resumo */
  .card { position: absolute; left: 70px; right: 70px; padding: 44px 50px; border-radius: 34px; background: rgba(20,26,38,.92); border: 1px solid #34405a; box-shadow: 0 30px 70px rgba(0,0,0,.55); }
  .card small { display: block; font: 700 28px "Geist Mono", monospace; letter-spacing: 6px; color: var(--suave); }
  .card b { display: block; font-size: 76px; font-weight: 800; letter-spacing: -2px; line-height: 1.05; margin-top: 14px; }
  .card span { display: block; font-size: 34px; line-height: 1.35; color: #c8d0de; margin-top: 16px; }

  .grande { position: absolute; left: 40px; right: 40px; text-align: center; font-weight: 800; letter-spacing: -8px; line-height: 1; font-variant-numeric: tabular-nums; }

  #fim { display: flex; flex-direction: column; align-items: center; padding-top: 360px; gap: 44px; text-align: center; }
  .logo { font-weight: 300; letter-spacing: 12px; font-size: 54px; text-align: center; }
  .logo b { color: var(--laranja); font-weight: 800; letter-spacing: 8px; }
  #fim .tag { font-size: 100px; font-weight: 750; line-height: 1.02; letter-spacing: -3px; }
  #fim .url { font: 600 40px "Geist", sans-serif; background: var(--cartao); border: 1px solid var(--borda); border-radius: 999px; padding: 22px 46px; }
  #cta { margin-top: 26px; font-size: 50px; font-weight: 750; line-height: 1.15; letter-spacing: -1px; padding: 30px 46px; border-radius: 34px; background: var(--laranja); color: #fff; box-shadow: 0 30px 70px rgba(255,106,19,.35); }
  #anel { position: absolute; left: 50%; top: 50%; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; border-radius: 50%; border: 3px solid var(--laranja); opacity: 0; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="palco">
  <div class="brilho" id="b1"></div><div class="brilho" id="b2"></div>
  <div id="grade"></div>
  <div id="cenas"></div>
  <div id="varredura"></div>
  <div id="anel"></div>
  <div class="cena" id="fim">
    <div class="logo">OVILE <b>DIAGNÓSTICO</b></div>
    <div class="tag">Sua eleição,<br><span class="k">voto a voto.</span></div>
    <div class="url">diagnostico.ovile.com.br</div>
    <div id="cta">💬 Comenta: o que você espera<br>do próximo governo?</div>
  </div>
  <div id="flash"></div>
</div>
<script>
const D = window.DADOS, T0 = [0, 8, 16, 24, 32, 40, 48, 56, 64, 72, 80], FIM = 88, DUR = 96;
const fmt = (v) => Math.round(v).toLocaleString("pt-BR");
const pct = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
const titulo = (linhas, top) => `<div class="abs titulo" style="top:${top}px">${linhas.map((l) => `<span class="linha">${l.split(" ").map((p) =>
  p.startsWith("*") ? `<span class="p k">${p.replaceAll("*", "")}</span>` : `<span class="p">${p}</span>`).join(" ")}</span>`).join("")}</div>`;

// hemiciclo: fileiras concêntricas; grupos em fatias contínuas da esquerda para a direita; linha tracejada na cadeira da maioria
function hemiciclo(grupos, maioria, filas) {
  const total = grupos.reduce((s, g) => s + g.n, 0), r0 = filas > 5 ? 170 : 200, r1 = 470;
  const raios = [...Array(filas)].map((_, i) => r0 + (r1 - r0) * i / (filas - 1)), somaR = raios.reduce((a, b) => a + b, 0), pos = [];
  let resto = total;
  raios.forEach((r, i) => { const n = i === filas - 1 ? resto : Math.round(total * r / somaR); resto -= n;
    for (let k = 0; k < n; k++) { const a = Math.PI * (1 - k / (n - 1)); pos.push({ a, f: i, x: 500 + r * Math.cos(a), y: 500 - r * Math.sin(a) }); } });
  pos.sort((p, q) => (q.a - p.a) || (p.f - q.f));
  const passo = Math.min((r1 - r0) / (filas - 1), Math.PI * r0 / (Math.round(total * r0 / somaR) - 1)), raio = passo * 0.42;
  const cores = grupos.flatMap((g, gi) => Array(g.n).fill([g.cor, gi]));
  const am = pos[maioria - 1].a, x1 = 500 + (r0 - 40) * Math.cos(am), y1 = 500 - (r0 - 40) * Math.sin(am), x2 = 500 + (r1 + 40) * Math.cos(am), y2 = 500 - (r1 + 40) * Math.sin(am);
  return `<svg class="hemi" viewBox="0 0 1000 560">${pos.map((p, i) => `<circle class="assento g${cores[i][1]}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${raio.toFixed(1)}" fill="#1b2232" data-cor="${cores[i][0]}"/>`).join("")}
    <g class="marca"><line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><text x="${x2}" y="${y2 - 18}">maioria: ${maioria}</text></g></svg>`;
}
const legenda = (grupos, top) => `<div class="legenda" style="top:${top}px">${grupos.map((g, i) => `<span class="lg${i}"><i style="background:${g.cor}"></i>${g.nome} <b class="conta" data-v="${g.n}">0</b></span>`).join("")}</div>`;
function medidor(nome, sub, base, meta, total, cor) {
  const w = (v) => (100 * v / total).toFixed(2);
  return `<div class="med"><div class="cab"><span>${nome}<small>${sub}</small></span><span class="faltam">faltam <span class="conta" data-v="${meta - base}">0</span></span></div>
    <div class="trilho"><div class="base" style="background:${cor}" data-w="${w(base)}"></div><div class="falta" style="left:${w(base)}%" data-w="${w(meta - base)}"></div><div class="meta" style="left:calc(${w(meta)}% - 2px)"></div></div>
    <div class="nums"><span>tem <b>${base}</b></span><span>maioria <b>${meta}</b> de ${total}</span></div></div>`;
}

const C = D.camara, S = D.senado, A = D.alep;
const AZ = "rgb(47,111,255)", VM = "rgb(229,49,47)", CE = "#6b7690", PSD = "#f5a623";
const gCam = [{ nome: "Coligação Lula", n: C.lula, cor: VM }, { nome: "Demais partidos", n: C.centro, cor: CE }, { nome: "Coligação Flávio", n: C.pl, cor: AZ }];
const gSen = [{ nome: "Coligação Lula", n: S.lula, cor: VM }, { nome: "Demais partidos", n: S.centro, cor: CE }, { nome: "Coligação Flávio", n: S.pl, cor: AZ }];
const gAlep = [{ nome: "Coligação Requião Filho", n: A.requiao, cor: VM }, { nome: "Coligação Sandro Alex", n: A.sandro, cor: PSD }, { nome: "Coligação Moro", n: A.moro, cor: AZ }];
const maxCentro = D.centro[0][1];
const cenas = [
  `<div class="cena" id="c0"><div class="abs rotulo" style="top:560px">Projeção · eleições 2026</div>${titulo(["Como fica o", "*governo* a partir", "de 2027?"], 640)}<div class="abs sub" style="top:1060px">Pela conta que decide: <b>quantas cadeiras<br>cada lado elegeu.</b></div></div>`,
  `<div class="cena" id="c1"><div class="cap"><small>CAPÍTULO 1</small><b>Brasil</b><i></i></div></div>`,
  `<div class="cena" id="c1b">${titulo(["1º turno para", "*presidente.*"], 300)}<div class="abs" style="top:720px">
     <div class="bar"><div class="cab"><span>Flávio Bolsonaro<small>PL · ${fmt(D.pres.flavio.v)} votos</small></span><b class="pc" data-v="${D.pres.flavio.p}">0</b></div><div class="trilho"><div class="enche" style="background:${AZ}" data-w="${D.pres.flavio.p * 1.6}"></div></div></div>
     <div class="bar"><div class="cab"><span>Lula<small>PT · ${fmt(D.pres.lula.v)} votos</small></span><b class="pc" data-v="${D.pres.lula.p}">0</b></div><div class="trilho"><div class="enche" style="background:${VM}" data-w="${D.pres.lula.p * 1.6}"></div></div></div>
   </div><div class="abs sub" style="top:1280px">Os dois disputam o <b>2º turno em 25 de outubro.</b><br>Mas quem governa precisa do Congresso.</div><div class="fonte">TSE · 1º turno, Brasil, % dos votos válidos</div></div>`,
  `<div class="cena" id="c2">${titulo(["Câmara dos", "*Deputados.*"], 260)}${hemiciclo(gCam, 257, 8)}${legenda(gCam, 1240)}<div class="abs sub" style="top:1400px">513 cadeiras. Nenhuma das duas coligações<br>chega perto da maioria sozinha.</div><div class="fonte">eleitos em 2026 · partidos das coligações de presidente</div></div>`,
  `<div class="cena" id="c3">${titulo(["Quem decide:", "*o* *centro.*"], 250)}<div class="abs sub" style="top:500px"><b>${C.centro} cadeiras</b> fora das duas coligações.</div><div class="abs" style="top:600px">${D.centro.map(([nm, n, det]) => `<div class="lin"><span>${nm}<small>${det ?? ""}</small></span><b>${n}</b><div class="t"><i data-w="${(100 * n / maxCentro).toFixed(1)}"></i></div></div>`).join("")}</div><div class="fonte">deputados federais eleitos em 2026</div></div>`,
  `<div class="cena" id="c4">${titulo(["*Senado.*"], 300)}${hemiciclo(gSen, 41, 6)}${legenda(gSen, 1240)}<div class="abs sub" style="top:1400px">54 eleitos agora + 27 eleitos em 2022.<br><b>Aqui, o PL larga bem na frente.</b></div><div class="fonte">partido pelo qual cada senador foi eleito</div></div>`,
  `<div class="cena" id="c5"><div class="cenario"><small>CENÁRIO 1</small><b>Se <span class="az">Flávio</span> vencer</b></div><div class="abs" style="top:520px">
     ${medidor("Câmara", `precisa de ${Math.round(100 * (257 - C.pl) / C.centro)}% do centro`, C.pl, 257, 513, AZ)}
     ${medidor("Senado", `precisa de ${Math.round(100 * (41 - S.pl) / S.centro)}% dos demais`, S.pl, 41, 81, AZ)}</div></div>`,
  `<div class="cena" id="c6"><div class="cenario"><small>CENÁRIO 2</small><b>Se <span class="vm">Lula</span> vencer</b></div><div class="abs" style="top:520px">
     ${medidor("Câmara", `precisa de ${Math.round(100 * (257 - C.lula) / C.centro)}% do centro`, C.lula, 257, 513, VM)}
     ${medidor("Senado", `precisa de ${Math.round(100 * (41 - S.lula) / S.centro)}% dos demais`, S.lula, 41, 81, VM)}</div></div>`,
  `<div class="cena" id="c7">${titulo(["A conta do", "*Congresso.*"], 260)}
     <div class="card" style="top:620px"><small>CÂMARA</small><b>Empate técnico.</b><span>${C.pl} × ${C.lula}: quem vencer depende do centro<br>para chegar a 257.</span></div>
     <div class="card" style="top:1020px"><small>SENADO</small><b>Vantagem <em class="az" style="font-style:normal">PL.</em></b><span>${S.pl} × ${S.lula}: o PL precisa de ${41 - S.pl} senadores a mais;<br>o PT, de ${41 - S.lula}.</span></div></div>`,
  `<div class="cena" id="c8"><div class="cap"><small>CAPÍTULO 2</small><b>Paraná</b><i></i></div><div class="abs sub" style="top:1180px"><b>Sergio Moro</b>, eleito no 1º turno com ${pct(D.moro.p)}.</div></div>`,
  `<div class="cena" id="c9">${titulo(["Assembleia", "*Legislativa.*"], 260)}${hemiciclo(gAlep, 28, 3)}${legenda(gAlep, 1240)}<div class="abs sub" style="top:1420px">54 cadeiras. A coligação de Moro<br>(PL, Podemos e Novo) fez <b>${A.moro}</b>.</div><div class="fonte">deputados estaduais eleitos em 2026 · coligações de governador</div></div>`,
  `<div class="cena" id="c10">${titulo(["Faltam", "*8* *votos.*"], 300)}<div class="grande" style="top:640px;font-size:300px;color:var(--psd)">${A.moro} + 8</div>
     <div class="abs sub" style="top:1000px">Para chegar a 28, Moro precisa de <b>mais 8</b>.<br>O maior bloco fora da coligação é o do <b>PSD<br>de Ratinho Júnior</b>, com ${A.sandro} deputados.</div>
     <div class="card" style="top:1320px"><small>EM BRASÍLIA</small><span style="margin-top:10px">Os dois senadores eleitos, <b style="display:inline;font-size:34px;letter-spacing:0">Filipe Barros (PL)</b> e <b style="display:inline;font-size:34px;letter-spacing:0">Deltan (Novo)</b>, são da coligação de Moro. Na bancada federal, ela fez ${D.prFed.moro} de 30.</span></div></div>`,
];
document.getElementById("cenas").innerHTML = cenas.join("");

const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
gsap.set([".cena"], { autoAlpha: 0 });
gsap.set(".titulo .p", { yPercent: 110 });
tl.to("#b1", { x: 320, y: -300, duration: DUR, ease: "sine.inOut" }, 0).to("#b2", { x: -240, y: 460, duration: DUR, ease: "sine.inOut" }, 0)
  .to("#grade", { x: 72, y: 144, duration: DUR, ease: "none" }, 0);
const contar = (el, t, dur, f = fmt) => { const o = { v: 0 }, alvo = +el.dataset.v; tl.to(o, { v: alvo, duration: dur, ease: "power2.out", onUpdate: () => (el.textContent = f(o.v)) }, t); };
const surge = (alvos, t, extra = {}) => tl.fromTo(alvos, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: .7, ...extra }, t);
const varre = (t) => tl.fromTo("#varredura", { x: 0 }, { x: 1900, duration: .9, ease: "power2.inOut" }, t);
const entra = (id, t, fim) => { const el = document.getElementById(id); tl.to(el, { autoAlpha: 1, duration: .01 }, t).fromTo(el, { scale: 1 }, { scale: 1.035, duration: fim - t, ease: "none" }, t)
  .to(el.querySelectorAll(".titulo .p"), { yPercent: 0, duration: .6, stagger: .08 }, t + .1).to(el, { autoAlpha: 0, filter: "blur(14px)", duration: .35, ease: "power2.in" }, fim - .4); return el; };
function capitulo(id, t, fim) {
  const el = entra(id, t, fim); tl.fromTo("#flash", { opacity: .55 }, { opacity: 0, duration: .5, ease: "power2.out", immediateRender: false }, t);
  tl.from(el.querySelector(".cap small"), { autoAlpha: 0, letterSpacing: "30px", duration: .9 }, t + .1)
    .from(el.querySelector(".cap b"), { autoAlpha: 0, scale: 1.4, filter: "blur(30px)", duration: 1.0, ease: "expo.out" }, t + .2)
    .from(el.querySelector(".cap i"), { scaleX: 0, duration: 1.2, ease: "expo.out" }, t + .5);
  if (el.querySelector(".sub")) surge(el.querySelector(".sub"), t + 2.4);
}
function hemi(el, t) {
  const svg = el.querySelector(".hemi"), grupos = [...new Set([...svg.querySelectorAll(".assento")].map((c) => c.classList[1]))];
  tl.from(svg, { autoAlpha: 0, scale: .92, transformOrigin: "50% 90%", duration: .7 }, t + .4);
  grupos.forEach((g, k) => { const a = svg.querySelectorAll("." + g), tg = t + 1.0 + k * 1.3;
    tl.to(a, { attr: { fill: (i, x) => x.dataset.cor }, duration: .2, stagger: { each: 1.1 / a.length, from: k === 1 ? "center" : k === 0 ? "start" : "end" } }, tg);
    surge(el.querySelector(".lg" + k), tg, { duration: .5 }); contar(el.querySelector(".lg" + k + " .conta"), tg, 1.1); });
  const m = svg.querySelector(".marca line"), len = Math.hypot(m.x2.baseVal.value - m.x1.baseVal.value, m.y2.baseVal.value - m.y1.baseVal.value);
