<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Ovile Diagnóstico · reels de dados</title>
<!-- Modelo de Reels 9:16, 60 s, só com dados (sem boneco): cada pasta serie/<id>/ tem reel.html (cópia deste arquivo) e textos.js
     com CFG.cenas = 8 cenas nos tempos 0, 4, 12, 20, 28, 36, 44, 52 (mesma trilha ../chiquini/trilha60.wav).
     Tipos de cena: abertura · contador · hemiciclo · barras · pares (2022 → 2026) · lista · destaque · fim.
     A linha do tempo fica pausada: window.__seek(t) posiciona o quadro (../renderizar.mjs grava 30 fps). ?play toca em tempo real. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="textos.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=Geist+Mono:wght@500;700&display=swap">
<style>
  :root { --laranja: #ff6a13; --laranja-2: #ffb074; --fundo: #07090f; --texto: #f2f5fa; --suave: #8b97ad; --cartao: #141a26; --borda: #2a3446; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fundo); font-family: "Geist", -apple-system, Arial, sans-serif; color: var(--texto); }
  #palco { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .brilho { position: absolute; border-radius: 50%; filter: blur(150px); }
  #b1 { width: 900px; height: 900px; background: #ff6a13; left: -300px; top: 1100px; opacity: .42; }
  #b2 { width: 700px; height: 700px; background: #4c8dff; right: -300px; top: 250px; opacity: .2; }
  .k { color: var(--laranja); }
  .abs { position: absolute; left: 70px; right: 70px; }
  .cena { position: absolute; inset: 0; }

  .logo { font-weight: 300; letter-spacing: 12px; font-size: 54px; text-align: center; }
  .logo b { color: var(--laranja); font-weight: 800; letter-spacing: 8px; }
  .rotulo { font: 600 30px "Geist Mono", monospace; letter-spacing: 6px; color: var(--suave); text-transform: uppercase; text-align: center; }
  .titulo { font-size: 92px; line-height: 1.03; font-weight: 750; letter-spacing: -2.8px; text-align: center; }
  .titulo .linha { display: block; overflow: hidden; padding-bottom: 8px; }
  .titulo .p { display: inline-block; }
  .sub { font-size: 40px; line-height: 1.3; color: #c8d0de; text-align: center; }
  .fonte { position: absolute; left: 0; right: 0; bottom: 70px; text-align: center; font: 500 24px "Geist Mono", monospace; color: #5d6880; letter-spacing: 1px; }

  /* cena 2: contador */
  #nome { top: 250px; font-size: 64px; font-weight: 700; text-align: center; letter-spacing: -1px; }
  #nome small { display: block; font: 600 30px "Geist Mono", monospace; color: var(--suave); letter-spacing: 6px; margin-top: 14px; }
  #conta { top: 440px; text-align: center; font-size: 230px; font-weight: 800; letter-spacing: -9px; color: var(--laranja); font-variant-numeric: tabular-nums; line-height: 1; }
  #conta-sub { top: 700px; }

  /* cena 3: barras */
  .barra { margin-top: 56px; }
  .barra .cab { display: flex; justify-content: space-between; align-items: baseline; font-size: 36px; margin-bottom: 16px; }
  .barra .cab b { font: 700 46px "Geist Mono", monospace; letter-spacing: -1px; }
  .barra .cab span small { display: block; font-size: 26px; color: var(--suave); }
  .barra .trilho { height: 64px; border-radius: 32px; background: var(--cartao); border: 1px solid var(--borda); overflow: hidden; }
  .barra .enche { height: 100%; width: 0; border-radius: 32px; background: #3a4458; }
  .barra.top .enche { background: linear-gradient(90deg, #ff6a13, #ffb074); }
  .barra.top .cab b { color: var(--laranja); }

  /* cenas 4 e 5: mapa */
  #mapa { position: absolute; left: 40px; top: 600px; width: 1000px; height: 820px; }
  .card { position: absolute; padding: 26px 32px; border-radius: 26px; background: rgba(16,21,31,.92); border: 1px solid #34405a; box-shadow: 0 30px 70px rgba(0,0,0,.6); }
  .card b { display: block; font: 700 64px/1.05 "Geist Mono", monospace; color: var(--laranja); letter-spacing: -1px; }
  .card span { display: block; font-size: 28px; line-height: 1.3; color: #c8d0de; margin-top: 8px; }

  /* cena 6: quocientes */
  #blocos { top: 820px; display: flex; gap: 14px; height: 200px; }
  .bloco { position: relative; border-radius: 22px; overflow: hidden; background: var(--cartao); border: 1px solid var(--borda); }
  .bloco i { position: absolute; inset: 0; background: linear-gradient(160deg, #ff6a13, #c94a06); transform-origin: 0 50%; transform: scaleX(0); }
  .bloco em { position: absolute; left: 24px; bottom: 18px; font: 700 34px "Geist Mono", monospace; font-style: normal; color: #fff; }

  /* cena 7: custo */
  #custo { top: 760px; text-align: center; font-size: 220px; font-weight: 800; letter-spacing: -8px; color: var(--laranja); line-height: 1; }


  /* boneco: corpo vetorial + rosto (foto oficial do TSE) recortado em adesivo */
  #boneco { position: absolute; left: 50%; top: 0; width: 420px; height: 940px; margin-left: -210px; transform-origin: 50% 100%; z-index: 4; }
  #boneco svg { position: absolute; left: 10px; top: 360px; width: 400px; height: 580px; overflow: visible; }
  #cabeca { position: absolute; left: 50%; top: 10px; width: 300px; margin-left: -150px; transform-origin: 50% 92%; z-index: 2; filter: drop-shadow(0 24px 30px rgba(0,0,0,.45)); }
  #cabeca img { display: block; width: 100%; }
  #sombra { position: absolute; left: 50%; bottom: -16px; width: 340px; height: 40px; margin-left: -170px; border-radius: 50%; background: rgba(0,0,0,.55); filter: blur(10px); }
  #fim { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 330px; gap: 44px; text-align: center; }
  #fim .tag { font-size: 100px; font-weight: 750; line-height: 1.02; letter-spacing: -3px; }
  #fim .url { font: 600 40px "Geist", sans-serif; background: var(--cartao); border: 1px solid var(--borda); border-radius: 999px; padding: 22px 46px; }
  #cta { margin-top: 26px; font-size: 50px; font-weight: 750; line-height: 1.15; letter-spacing: -1px; padding: 30px 46px; border-radius: 34px; background: var(--laranja); color: #fff; box-shadow: 0 30px 70px rgba(255,106,19,.35); }
  #cta span { font-size: 54px; }
  #anel { position: absolute; left: 50%; top: 50%; width: 1600px; height: 1600px; margin: -800px 0 0 -800px; border-radius: 50%; border: 3px solid var(--laranja); opacity: 0; }
</style>
<style>
  .grande { position: absolute; left: 40px; right: 40px; text-align: center; font-weight: 800; letter-spacing: -8px; color: var(--laranja); line-height: 1; font-variant-numeric: tabular-nums; }
  .hemi { position: absolute; left: 60px; top: 700px; width: 960px; height: 520px; overflow: visible; }
  .legenda { position: absolute; left: 70px; right: 70px; top: 1290px; display: flex; flex-wrap: wrap; gap: 14px 26px; justify-content: center; font-size: 32px; }
  .legenda span { display: inline-flex; align-items: center; gap: 12px; }
  .legenda i { width: 26px; height: 26px; border-radius: 50%; display: inline-block; }
  .legenda b { font-family: "Geist Mono", monospace; }
  .par { margin-top: 50px; }
  .barra { margin-top: 70px; }
  .par .cab { display: flex; justify-content: space-between; align-items: baseline; font-size: 38px; margin-bottom: 14px; }
  .par .cab b { font: 700 42px "Geist Mono", monospace; }
  .par .cab b em { font-style: normal; color: var(--suave); font-weight: 500; }
  .par .linhas { display: grid; gap: 8px; }
  .par .t { height: 34px; border-radius: 17px; background: var(--cartao); border: 1px solid var(--borda); overflow: hidden; }
  .par .t i { display: block; height: 100%; width: 0; border-radius: 17px; }
  .lista .item { display: flex; justify-content: space-between; align-items: baseline; padding: 22px 0; border-bottom: 1px solid var(--borda); font-size: 38px; }
  .lista .item span small { display: block; font-size: 26px; color: var(--suave); margin-top: 4px; }
  .lista .item b { font: 700 40px "Geist Mono", monospace; color: var(--laranja); white-space: nowrap; margin-left: 20px; }
</style>
</head>
<body>
<div id="palco">
  <div class="brilho" id="b1"></div><div class="brilho" id="b2"></div>
  <div id="cenas"></div>
  <div id="anel"></div>
  <div class="cena" id="fim">
    <div class="logo">OVILE <b>DIAGNÓSTICO</b></div>
    <div class="tag">Sua eleição,<br><span class="k">voto a voto.</span></div>
    <div class="url">diagnostico.ovile.com.br</div>
    <div id="cta"><span>💬</span> <span id="cta-txt">Comenta: de qual político<br>você quer ver os dados?</span></div>
  </div>
</div>
<script>
const T0 = [0, 4, 12, 20, 28, 36, 44, 52];
const fmt = (v, tipo) => tipo === "reais" ? (v >= 1e6 ? `R$ ${(v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 2 })} mi` : `R$ ${Math.round(v / 1e3)} mil`) : Math.round(v).toLocaleString("pt-BR");
const titulo = (linhas, top) => `<div class="abs titulo" style="top:${top}px">${linhas.map((l) => `<span class="linha">${l.split(" ").map((p) =>
  p.startsWith("*") ? `<span class="p k">${p.replaceAll("*", "")}</span>` : `<span class="p">${p}</span>`).join(" ")}</span>`).join("")}</div>`;
if (CFG.cta) document.getElementById("cta-txt").innerHTML = CFG.cta;

// hemiciclo: assentos em fileiras concêntricas, preenchidos da esquerda para a direita na ordem dos grupos
function hemiciclo(total, grupos) {
  // fileiras concêntricas; cada fileira recebe cadeiras proporcionais ao comprimento do arco; os grupos ocupam fatias
  // contínuas da esquerda para a direita (ordena por ângulo, empate pela fileira de dentro para fora)
  const filas = total > 40 ? 4 : 3, r0 = 210, r1 = 460, raios = [...Array(filas)].map((_, i) => r0 + (r1 - r0) * i / (filas - 1));
  const somaR = raios.reduce((a, b) => a + b, 0), pos = [];
  let resto = total;
  raios.forEach((r, i) => { const n = i === filas - 1 ? resto : Math.round(total * r / somaR); resto -= n;
    for (let k = 0; k < n; k++) { const a = Math.PI * (1 - k / (n - 1)); pos.push({ a, f: i, x: 480 + r * Math.cos(a), y: 480 - r * Math.sin(a) }); } });
  pos.sort((p, q) => (q.a - p.a) || (p.f - q.f));
  const cores = grupos.flatMap((g) => Array(g.n).fill(g.cor));
  const passo = Math.min((r1 - r0) / (filas - 1), Math.PI * r0 / (Math.round(total * r0 / somaR) - 1));
  const raio = passo * 0.42;
  return `<svg class="hemi" viewBox="0 0 960 520">${pos.map((p, i) => `<circle class="assento" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${raio.toFixed(1)}" fill="#1b2232" data-cor="${cores[i]}"/>`).join("")}</svg>`;
}

const html = (c, i) => {
  const id = `c${i}`;
  if (c.tipo === "abertura") return `<div class="cena" id="${id}"><div class="abs rotulo" style="top:330px">${c.rotulo}</div>${titulo(c.titulo, 400)}</div>`;
  if (c.tipo === "contador") return `<div class="cena" id="${id}">${c.titulo ? titulo(c.titulo, 380) : ""}<div class="grande conta" data-v="${c.valor}" data-tipo="${c.formato ?? ""}" style="top:${c.titulo ? 720 : 640}px;font-size:${c.tam ?? 300}px">0</div><div class="abs sub" style="top:${c.titulo ? 1060 : 980}px">${c.sub ?? ""}</div></div>`;
  if (c.tipo === "destaque") return `<div class="cena" id="${id}">${titulo(c.titulo, 380)}<div class="grande" style="top:800px;font-size:${c.tam ?? 210}px">${c.grande}</div><div class="abs sub" style="top:1110px">${c.sub ?? ""}</div>${c.fonte ? `<div class="fonte">${c.fonte}</div>` : ""}</div>`;
  if (c.tipo === "hemiciclo") return `<div class="cena" id="${id}">${titulo(c.titulo, 260)}${hemiciclo(c.grupos.reduce((s, g) => s + g.n, 0), c.grupos)}<div class="legenda">${c.grupos.map((g) => `<span><i style="background:${g.cor}"></i>${g.nome} <b>${g.n}</b></span>`).join("")}</div>${c.sub ? `<div class="abs sub" style="top:1560px">${c.sub}</div>` : ""}</div>`;
  if (c.tipo === "barras") { const max = Math.max(...c.itens.map((x) => x.v));
    return `<div class="cena" id="${id}">${titulo(c.titulo, 300)}<div class="abs" style="top:${c.top ?? 760}px">${c.itens.map((b, k) => `<div class="barra${k === 0 ? " top" : ""}"><div class="cab"><span>${b.nome}<small>${b.detalhe ?? ""}</small></span><b class="conta" data-v="${b.v}" data-tipo="${c.formato ?? ""}">0</b></div><div class="trilho"><div class="enche" data-w="${(100 * b.v / max).toFixed(1)}"></div></div></div>`).join("")}</div>${c.fonte ? `<div class="fonte">${c.fonte}</div>` : ""}</div>`; }
  if (c.tipo === "pares") { const max = Math.max(...c.itens.flatMap((x) => [x.antes, x.depois]));
    return `<div class="cena" id="${id}">${titulo(c.titulo, 300)}<div class="abs" style="top:640px">${c.itens.map((p) => `<div class="par"><div class="cab"><span>${p.nome}</span><b><em>${p.antes} →</em> ${p.depois}</b></div><div class="linhas"><div class="t"><i data-w="${(100 * p.antes / max).toFixed(1)}" style="background:#3a4458"></i></div><div class="t"><i data-w="${(100 * p.depois / max).toFixed(1)}" style="background:${p.cor ?? "var(--laranja)"}"></i></div></div></div>`).join("")}</div><div class="fonte">${c.fonte ?? "barra cinza: 2022 · colorida: 2026"}</div></div>`; }
  if (c.tipo === "lista") return `<div class="cena" id="${id}">${titulo(c.titulo, 240)}<div class="abs lista" style="top:${c.top ?? 640}px">${c.itens.map((x) => `<div class="item"><span>${x.nome}<small>${x.detalhe ?? ""}</small></span><b>${x.valor}</b></div>`).join("")}</div>${c.fonte ? `<div class="fonte">${c.fonte}</div>` : ""}</div>`;
};
document.getElementById("cenas").innerHTML = CFG.cenas.map(html).join("");

const tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });
gsap.set([".cena", "#fim"], { autoAlpha: 0 });
gsap.set(".titulo .p", { yPercent: 110 });
tl.to("#b1", { x: 300, y: -260, duration: 60, ease: "sine.inOut" }, 0).to("#b2", { x: -220, y: 420, duration: 60, ease: "sine.inOut" }, 0);
const contar = (el, t, dur) => { const o = { v: 0 }, alvo = +el.dataset.v, tipo = el.dataset.tipo; tl.to(o, { v: alvo, duration: dur, ease: "power2.out", onUpdate: () => (el.textContent = fmt(o.v, tipo)) }, t); };
const surge = (alvos, t, extra = {}) => tl.fromTo(alvos, { autoAlpha: 0, y: 40 }, { autoAlpha: 1, y: 0, duration: .7, ...extra }, t);

CFG.cenas.forEach((c, i) => {
  const t = T0[i], el = document.getElementById(`c${i}`), fimC = (T0[i + 1] ?? 52) - .4;
  tl.to(el, { autoAlpha: 1, duration: .01 }, t);
  tl.to(el.querySelectorAll(".titulo .p"), { yPercent: 0, duration: .6, stagger: .08 }, t + (i ? 0 : .5));
  if (c.tipo === "abertura") tl.from(el.querySelector(".rotulo"), { autoAlpha: 0, letterSpacing: "20px", duration: 1 }, .1);
  if (c.tipo === "contador") { const g = el.querySelector(".grande"); tl.fromTo(g, { autoAlpha: 0, scale: .8 }, { autoAlpha: 1, scale: 1, duration: .6 }, t + .4); contar(g, t + .4, 2.6); surge(el.querySelector(".sub"), t + 3.2); }
  if (c.tipo === "destaque") { tl.fromTo(el.querySelector(".grande"), { autoAlpha: 0, scale: .7, filter: "blur(16px)" }, { autoAlpha: 1, scale: 1, filter: "blur(0px)", duration: .7, ease: "back.out(1.7)" }, t + 1.0); surge(el.querySelector(".sub"), t + 2.2); if (el.querySelector(".fonte")) surge(el.querySelector(".fonte"), t + 2.8); }
  if (c.tipo === "hemiciclo") { const a = [...el.querySelectorAll(".assento")]; tl.from(el.querySelector(".hemi"), { autoAlpha: 0, duration: .6 }, t + .5)
      .to(a, { attr: { fill: (k, x) => x.dataset.cor }, duration: .25, stagger: 3.2 / a.length }, t + 1.0);
    surge(el.querySelectorAll(".legenda span"), t + 3.0, { stagger: .12, duration: .5 }); if (el.querySelector(".sub")) surge(el.querySelector(".sub"), t + 4.6); }
  if (c.tipo === "barras") { el.querySelectorAll(".barra").forEach((b, k) => { const tb = t + 1.2 + k * 1.0; surge(b, tb, { duration: .5 });
      tl.to(b.querySelector(".enche"), { width: b.querySelector(".enche").dataset.w + "%", duration: 1.8, ease: "power2.out" }, tb + .1); contar(b.querySelector(".conta"), tb + .1, 1.8); });
    if (el.querySelector(".fonte")) surge(el.querySelector(".fonte"), t + 3); }
  if (c.tipo === "pares") { el.querySelectorAll(".par").forEach((p, k) => { const tb = t + 1.0 + k * .7; surge(p, tb, { duration: .5 });
      p.querySelectorAll(".t i").forEach((x, j) => tl.to(x, { width: x.dataset.w + "%", duration: 1.2, ease: "power2.out" }, tb + .2 + j * .5)); });
    surge(el.querySelector(".fonte"), t + 2.5); }
  if (c.tipo === "lista") { surge(el.querySelectorAll(".item"), t + 1.0, { stagger: .35, duration: .5 }); if (el.querySelector(".fonte")) surge(el.querySelector(".fonte"), t + 3); }
  tl.to(el, { autoAlpha: 0, filter: "blur(14px)", duration: .35, ease: "power2.in" }, fimC);
});

tl.fromTo("#anel", { autoAlpha: .9, scale: .05 }, { autoAlpha: 0, scale: 1.2, duration: 1.4, ease: "power2.out", immediateRender: false }, 52.0)
  .to("#fim", { autoAlpha: 1, duration: .01 }, 52.0)
  .from("#fim .logo", { autoAlpha: 0, y: 50, filter: "blur(16px)", duration: .7 }, 52.0)
  .from("#fim .tag", { autoAlpha: 0, scale: .9, filter: "blur(16px)", duration: .8 }, 52.3)
  .from("#fim .url", { autoAlpha: 0, y: 30, duration: .7, ease: "back.out(2)" }, 53.0)
  .from("#cta", { autoAlpha: 0, scale: .8, y: 40, duration: .7, ease: "back.out(1.8)" }, 54.0)
  .to("#cta", { scale: 1.05, duration: .25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 55.0)
  .to("#palco", { autoAlpha: 0, duration: .8, ease: "power1.in" }, 59.2).set({}, {}, 60);
window.__duracao = 60;
window.__seek = (t) => { tl.seek(t, false); };
window.__pronto = document.fonts.ready;
if (location.search.includes("play")) tl.play();
</script>
</body>
</html>
