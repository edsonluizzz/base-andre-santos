<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aniversários – UMADC</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0d0d;--card:#1e1e1e;--border:#2a2a2a;--gold:#c9a84c;--gold-light:#e8c97a;
    --gold-muted:#7a6330;--text:#f0ece4;--muted:#888;--hl:#c9a84c22;--green:#2ecc71;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;padding:0 0 80px;}
  header{background:linear-gradient(135deg,#111 0%,#1a1508 50%,#111 100%);border-bottom:1px solid var(--gold-muted);padding:40px 32px 32px;text-align:center;position:relative;overflow:hidden;}
  header::before{content:'';position:absolute;top:-80px;left:50%;transform:translateX(-50%);width:400px;height:400px;background:radial-gradient(circle,#c9a84c18 0%,transparent 70%);pointer-events:none;}
  .header-tag{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;opacity:.8;}
  header h1{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,46px);color:var(--gold-light);line-height:1.1;margin-bottom:8px;}
  header p{color:var(--muted);font-size:14px;font-weight:300;}
  .wrap{max-width:980px;margin:0 auto;padding:0 24px;}
  .controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:28px;}
  .search-box{position:relative;flex:1;min-width:200px;}
  .search-box input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 16px 10px 38px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
  .search-box input:focus{border-color:var(--gold-muted);}
  .search-box::before{content:'🔍';position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5;}
  .btn-group{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{background:var(--card);border:1px solid var(--border);color:var(--muted);padding:9px 14px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all .2s;white-space:nowrap;}
  .btn:hover,.btn.active{border-color:var(--gold);color:var(--gold);background:var(--hl);}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px;}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 20px;flex:1;min-width:110px;text-align:center;}
  .stat-num{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);line-height:1;}
  .stat-label{font-size:11px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px;}
  .sec-title{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .sec-title::after{content:'';flex:1;height:1px;background:var(--border);}
  .next-wrap{margin-top:28px;}
  .next-cards{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .nc{background:linear-gradient(135deg,var(--card),#1a1508);border:1px solid var(--gold-muted);border-radius:12px;padding:16px 20px;min-width:160px;flex-shrink:0;transition:transform .2s,box-shadow .2s;}
  .nc:hover{transform:translateY(-3px);box-shadow:0 8px 24px #c9a84c15;}
  .nc .dl{font-size:11px;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;}
  .nc .nn{font-weight:600;font-size:14px;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;}
  .nc .nd{font-size:12px;color:var(--muted);}
  .today-badge{background:var(--gold);color:#111;font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 7px;border-radius:20px;text-transform:uppercase;margin-left:6px;}
  .main-list{margin-top:28px;}
  .month-block{margin-bottom:32px;}
  .month-header{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .month-name{font-family:'Playfair Display',serif;font-size:20px;color:var(--gold-light);font-weight:700;}
  .month-count{background:var(--gold-muted);color:var(--gold-light);font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;}
  .month-line{flex:1;height:1px;background:var(--border);}
  .bday-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:12px;}
  .bday-card{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .2s,box-shadow .2s;}
  .bday-card:hover{border-color:var(--gold-muted);box-shadow:0 4px 20px #c9a84c0d;}
  .bday-card.is-today{border-color:var(--gold);background:linear-gradient(135deg,#1e1e1e,#1a1508);}
  .card-top{display:flex;align-items:flex-start;padding:14px 16px 10px;gap:12px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--gold-muted);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:15px;color:var(--gold-light);flex-shrink:0;}
  .card-name{font-weight:600;font-size:14px;color:var(--text);line-height:1.25;}
  .card-date{font-size:12px;color:var(--gold);margin-top:3px;font-weight:500;}
  .card-nodate{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic;}
  .card-msg{margin:0 14px;background:#161616;border:1px solid #252525;border-radius:8px;padding:10px 13px;font-size:13px;line-height:1.6;color:#ccc;}
  .card-footer{padding:10px 14px 14px;display:flex;justify-content:flex-end;}
  .btn-copy{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:20px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .2s;}
  .btn-copy:hover{border-color:var(--green);color:var(--green);background:#2ecc7112;}
  .btn-copy.copied{border-color:var(--green);color:var(--green);background:#2ecc7118;}
  .btn-copy svg{width:13px;height:13px;flex-shrink:0;}
  .empty{text-align:center;padding:48px 24px;color:var(--muted);font-size:14px;}
  @media(max-width:600px){header{padding:28px 20px 24px;}.wrap{padding:0 16px;}.bday-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header>
  <div class="header-tag">UMADC · Gestão</div>
  <h1>🎂 Aniversários</h1>
  <p>Lista completa · Mensagens para WhatsApp</p>
</header>

<div class="wrap">
  <div class="controls">
    <div class="search-box"><input type="text" id="si" placeholder="Buscar por nome..." oninput="render()"></div>
    <div class="btn-group" id="mbtn"><button class="btn active" onclick="fm('todos',this)">Todos</button></div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num" id="sT">—</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-num" id="sM">—</div><div class="stat-label">Este mês</div></div>
    <div class="stat"><div class="stat-num" id="s30">—</div><div class="stat-label">Próx. 30 dias</div></div>
    <div class="stat"><div class="stat-num" id="sSem">—</div><div class="stat-label">Sem data</div></div>
  </div>
  <div class="next-wrap">
    <div class="sec-title">Próximos aniversários</div>
    <div class="next-cards" id="nc"></div>
  </div>
  <div class="main-list" id="ml"></div>
</div>

<script>
const P=[

  {n:"Alana Silva De Oliveira",d:"16/12",m:"🎉 Feliz aniversário, Alana! Que esse novo ano de vida seja cheio da presença de Deus e de muitas alegrias!"},
  {n:"Alessandra Caroline",d:"01/08",m:"🎂 Parabéns, Alessandra! Que Deus te abençoe ricamente nesse novo ciclo. Muitas felicidades!"},
  {n:"Alex Sales Martins",d:"17/03",m:"🙏 Hoje é dia do Alex! Que o Senhor te honre em cada passo desse novo ano de vida. Parabéns!"},
  {n:"Andre França Fonseca",d:"18/01",m:"🎉 Feliz aniversário, Andre! Que esse seja um ano de muito crescimento e graça sobre sua vida!"},
  {n:"Andressa Sales Martins",d:"30/05",m:"🎂 Hoje comemoramos você, Andressa! Que o Senhor te guarde e te abençoe nesse novo ano. Parabéns!"},
  {n:"Anny",d:"25/09",m:"🎉 Parabéns, Anny! Que esse aniversário marque um novo tempo de bênçãos e propósito na sua vida!"},
  {n:"Bruna Marques",d:"23/10",m:"🎂 Feliz aniversário, Bruna! Que Deus transborde alegria e paz no seu coração hoje e sempre. 🙌"},
  {n:"Cristina",d:"14/06",m:"🎉 Hoje é dia da Cristina! Parabéns! Que o Senhor te cubra de graça nesse novo ciclo de vida."},
  {n:"Cyntia",d:"19/12",m:"🎂 Feliz aniversário, Cyntia! Que esse dia seja especial e o próximo ano ainda mais abençoado!"},
  {n:"Daniel Borge Sales",d:"16/11",m:"🙏 Parabéns, Daniel! Que o Senhor te fortaleça e te guie em cada etapa desse novo ano de vida."},
  {n:"Diovana Ribeiro",d:"19/05",m:"🎉 Hoje é dia da Diovana! Que Deus te surpreenda com coisas novas nesse novo ciclo. Parabéns!"},
  {n:"Edson Luiz da Silva",d:"07/09",m:"🎂 Hoje é aniversário do nosso líder, Edson! Que o Senhor continue honrando sua vida, sua família e seu ministério. Parabéns! 🙌"},
  {n:"Evander",d:"23/11",m:"🎉 Feliz aniversário, Evander! Que esse novo ano de vida seja marcado pela fidelidade de Deus sobre você!"},
  {n:"Gabriela",d:"23/02",m:"🎂 Parabéns, Gabi! Que o Senhor te abençoe imensamente nesse novo ciclo. Muita alegria pra você!"},
  {n:"Giovanna",d:"10/06",m:"🎉 Hoje é dia da Giovanna! Parabéns! Que Deus te encha de propósito e alegria nesse novo ano."},
  {n:"Giulia Felix Gonçalves Godoy",d:"06/10",m:"🎂 Feliz aniversário, Giulia! Que o Senhor te surpreenda de formas novas nesse novo ciclo de vida. 🙏"},
  {n:"Grazi",d:"15/04",m:"🎉 Parabéns, Grazi! Que esse aniversário seja o começo de um ano cheio da graça e do cuidado de Deus!"},
  {n:"Hellen",d:"28/06",m:"🎂 Hoje é dia da Hellen! Que o Senhor te abençoe e te guarde nesse novo ano de vida. Parabéns!"},
  {n:"Ingrid",d:"09/06",m:"🎉 Feliz aniversário, Ingrid! Que Deus escreva coisas lindas na sua história nesse novo ciclo!"},
  {n:"Jean",d:"31/03",m:"🎂 Parabéns, Jean! Que esse novo ano de vida seja marcado pela presença e pelo favor de Deus!"},
  {n:"Jessica Caroline Andrioli",d:"07/12",m:"🎉 Hoje é dia da Jessica! Que o Senhor te abençoe com saúde, paz e muito propósito. Parabéns!"},
  {n:"Jô",d:"17/06",m:"🎂 Feliz aniversário, Jô! Que Deus transborde bênçãos sobre você nesse novo ano de vida. 🙌"},
  {n:"João Victor Ferreira",d:"19/02",m:"🎉 Parabéns, João Victor! Que esse novo ciclo seja de muito crescimento na fé e na vida!"},
  {n:"Kamille",d:"19/12",m:"🎂 Hoje é dia da Kamille! Feliz aniversário! Que Deus te abençoe com coisas que só Ele pode dar."},
  {n:"Kauana",d:"18/10",m:"🎉 Parabéns, Kauana! Que esse novo ano de vida seja cheio da presença e do cuidado de Deus!"},
  {n:"Khevin",d:"08/08",m:"🎂 Feliz aniversário, Khevin! Que o Senhor te guie e te abençoe em cada detalhe desse novo ciclo!"},
  {n:"Lucas Camargo",d:"22/10",m:"🎉 Parabéns, Lucas! Que Deus honre sua vida e te surpreenda nesse novo ano. Muitas bênçãos!"},
  {n:"Lucas Diego",d:null,m:"🎂 Feliz aniversário, Lucas Diego! Que o Senhor te abençoe e te guie nesse novo ciclo de vida!"},
  {n:"Luciana De Jesus De Sousa",d:"05/08",m:"🎂 Hoje é dia da Luciana! Feliz aniversário! Que o Senhor te encha de alegria e graça nesse novo ciclo."},
  {n:"Marcelo",d:"27/11",m:"🎉 Parabéns, Marcelo! Que esse novo ano de vida seja de vitórias e da presença de Deus sobre você!"},
  {n:"Max",d:null,m:"🎉 Feliz aniversário, Max! Que Deus te abençoe ricamente e escreva um novo capítulo lindo na sua história!"},
  {n:"Mayko Espirito Santo",d:"09/12",m:"🎂 Feliz aniversário, Mayko! Que o Senhor te abençoe e te use grandemente nesse novo ciclo de vida!"},
  {n:"Miriã Pereira De Morais",d:"27/05",m:"🎉 Hoje é dia da Miriã! Parabéns! Que Deus continue fazendo coisas lindas na sua vida. 🙏"},
  {n:"Pedro Henrique",d:"24/11",m:"🎂 Parabéns, Pedro! Que esse novo ano de vida seja marcado pela fidelidade e pelo amor de Deus!"},
  {n:"Pr Ailton",d:"11/11",m:"🙏 Hoje é aniversário do Pr. Ailton! Que o Senhor o honre e recompense cada semeadura na Sua obra. Parabéns, pastor!"},
  {n:"Pra Néia",d:"18/09",m:"🙏 Feliz aniversário, Pra. Néia! Que o Senhor a abençoe e a recompense por tudo que semeia com amor. Parabéns!"},
  {n:"Rafael Foice",d:"19/08",m:"🎂 Parabéns, Rafael! Que esse novo ciclo seja de muita graça, saúde e bênçãos do Senhor!"},
  {n:"Rafinha",d:null,m:"🎉 Feliz aniversário, Rafinha! Que o Senhor te abençoe e te surpreenda nesse novo ano de vida!"},
  {n:"Raphaelee",d:"21/10",m:"🎉 Feliz aniversário, Raphaelee! Que Deus te abençoe ricamente nesse novo ano de vida. 🙌"},
  {n:"Ronaldo",d:"13/08",m:"🎂 Parabéns, Ronaldo! Que o Senhor te honre e te abençoe em cada área da sua vida nesse novo ciclo!"},
  {n:"Taiwan",d:"20/03",m:"🎉 Hoje é dia do Taiwan! Feliz aniversário! Que Deus te surpreenda com bênçãos nesse novo ano de vida."},
  {n:"Thaiane",d:"23/03",m:"🎂 Parabéns, Thaiane! Que esse novo ciclo seja cheio da presença e do cuidado de Deus sobre você!"},
  {n:"Thainan Crystian Moraes",d:"14/10",m:"🎉 Feliz aniversário, Thainan! Que o Senhor escreva um novo capítulo lindo na sua história esse ano!"},
  {n:"Vitor",d:"03/12",m:"🎂 Parabéns, Vitor! Que Deus te abençoe e te guie nesse novo ano de vida. Muitas bênçãos!"},
  {n:"Viviane",d:"07/04",m:"🎉 Hoje é dia da Viviane! Feliz aniversário! Que o Senhor te surpreenda com coisas novas nesse ciclo."},
  {n:"Wagner",d:"18/08",m:"🎂 Parabéns, Wagner! Que esse novo ano de vida seja marcado pela graça e pelo favor de Deus sobre você!"}
];
const MES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
function pd(d){if(!d)return null;const[a,b]=d.split('/').map(Number);return{dia:a,mes:b};}
function du(d){if(!d)return null;const{dia,mes}=pd(d);const t=new Date();t.setHours(0,0,0,0);let b=new Date(t.getFullYear(),mes-1,dia);if(b<t)b=new Date(t.getFullYear()+1,mes-1,dia);return Math.floor((b-t)/86400000);}
function it(d){if(!d)return false;const{dia,mes}=pd(d);const n=new Date();return dia===n.getDate()&&mes===n.getMonth()+1;}
function ini(n){const p=n.trim().split(' ').filter(Boolean);return p.length===1?p[0][0].toUpperCase():(p[0][0]+p[p.length-1][0]).toUpperCase();}

const months=[...new Set(P.filter(x=>x.d).map(x=>pd(x.d).mes))].sort((a,b)=>a-b);
const bg=document.getElementById('mbtn');
months.forEach(m=>{const b=document.createElement('button');b.className='btn';b.textContent=MES[m-1].substring(0,3);b.onclick=function(){fm(m,this);};bg.appendChild(b);});
const bs=document.createElement('button');bs.className='btn';bs.textContent='Sem data';bs.onclick=function(){fm('semdata',this);};bg.appendChild(bs);

let am='todos';
function fm(m,b){am=m;document.querySelectorAll('#mbtn .btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();}

function stats(){
  const cm=new Date().getMonth()+1;
  document.getElementById('sT').textContent=P.length;
  document.getElementById('sM').textContent=P.filter(x=>x.d&&pd(x.d).mes===cm).length;
  document.getElementById('s30').textContent=P.filter(x=>{const d=du(x.d);return d!==null&&d<=30;}).length;
  document.getElementById('sSem').textContent=P.filter(x=>!x.d).length;
}

function nextCards(){
  const up=P.filter(x=>x.d).map(x=>({...x,days:du(x.d)})).sort((a,b)=>a.days-b.days).slice(0,8);
  const c=document.getElementById('nc');c.innerHTML='';
  up.forEach(x=>{const{dia,mes}=pd(x.d);const e=document.createElement('div');e.className='nc';
    e.innerHTML=`<div class="dl">${x.days===0?'<span class="today-badge">Hoje!</span>':`em ${x.days} dia${x.days!==1?'s':''}`}</div><div class="nn" title="${x.n}">${x.n}</div><div class="nd">${String(dia).padStart(2,'0')}/${String(mes).padStart(2,'0')}</div>`;
    c.appendChild(e);});
}

const msgMap={};
function copyMsg(id){
  const msg=msgMap[id];if(!msg)return;
  navigator.clipboard.writeText(msg).then(()=>{
    const btn=document.getElementById('cb_'+id);
    btn.classList.add('copied');
    btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copiado!';
    setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copiar mensagem';},2200);
  });
}

function buildCard(x,idx){
  msgMap[idx]=x.m;
  const card=document.createElement('div');
  card.className='bday-card'+(it(x.d)?' is-today':'');
  const ds=x.d?(()=>{const{dia,mes}=pd(x.d);return`${String(dia).padStart(2,'0')}/${String(mes).padStart(2,'0')}`;})():null;
  const tb=it(x.d)?'<span class="today-badge" style="margin-left:6px;">Hoje!</span>':'';
  const dateEl=x.d?`<div class="card-date">📅 ${ds}${tb}</div>`:'<div class="card-nodate">Data não informada</div>';
  card.innerHTML=`
    <div class="card-top">
      <div class="avatar">${ini(x.n)}</div>
      <div style="flex:1;min-width:0;"><div class="card-name">${x.n}</div>${dateEl}</div>
    </div>
    <div class="card-msg">${x.m||'<span style="color:var(--muted);font-style:italic;font-size:12px;">Sem mensagem.</span>'}</div>
    <div class="card-footer">
      ${x.m?`<button class="btn-copy" id="cb_${idx}" onclick="copyMsg(${idx})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copiar mensagem</button>`:''}
    </div>`;
  return card;
}

function render(){
  const q=document.getElementById('si').value.toLowerCase().trim();
  const fil=P.map((x,i)=>({...x,_i:i})).filter(x=>{
    if(!x.n.toLowerCase().includes(q))return false;
    if(am==='todos')return true;
    if(am==='semdata')return!x.d;
    if(!x.d)return false;
    return pd(x.d).mes===am;
  });
  const ml=document.getElementById('ml');ml.innerHTML='';
  if(!fil.length){ml.innerHTML='<div class="empty">Nenhum resultado encontrado.</div>';return;}
  const gr={};
  fil.forEach(x=>{const k=x.d?pd(x.d).mes:'sem';if(!gr[k])gr[k]=[];gr[k].push(x);});
  const keys=Object.keys(gr).filter(k=>k!=='sem').sort((a,b)=>Number(a)-Number(b));
  if(gr['sem'])keys.push('sem');
  keys.forEach(key=>{
    const items=gr[key].sort((a,b)=>{if(!a.d)return 1;if(!b.d)return -1;return pd(a.d).dia-pd(b.d).dia;});
    const bl=document.createElement('div');bl.className='month-block';
    const lb=key==='sem'?'Sem Data':MES[Number(key)-1];
    bl.innerHTML=`<div class="month-header"><span class="month-name">${lb}</span><span class="month-count">${items.length}</span><span class="month-line"></span></div>`;
    const grid=document.createElement('div');grid.className='bday-grid';
    items.forEach(x=>grid.appendChild(buildCard(x,x._i)));
    bl.appendChild(grid);ml.appendChild(bl);
  });
}

stats();nextCards();render();
</script>
</body>
</html>
