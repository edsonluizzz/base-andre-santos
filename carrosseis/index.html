<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ovile — Carrosséis Instagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0a0a0f;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 48px;
    }

    /* ── Header ─────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
      width: 100%;
      max-width: 600px;
    }
    .header-text h1 { font-size: 19px; font-weight: 700; }
    .header-text p { font-size: 13px; color: #64748b; margin-top: 3px; }

    /* ── Tabs ────────────────────────────────────── */
    .carousel-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      width: 100%;
      max-width: 600px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(99,102,241,.3);
      background: transparent;
      color: #64748b;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .2s;
    }
    .tab:hover { border-color: rgba(99,102,241,.6); color: #f8fafc; }
    .tab.active { background: #6366f1; border-color: #6366f1; color: #fff; }

    /* ── Slide area ──────────────────────────────── */
    .slide-area { width: 540px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

    .slide-wrapper {
      width: 540px; height: 540px;
      border-radius: 14px; overflow: hidden;
      box-shadow: 0 0 0 1px rgba(99,102,241,.15), 0 0 40px rgba(99,102,241,.15), 0 24px 64px rgba(0,0,0,.6);
    }

    #slide-canvas {
      width: 540px; height: 540px;
      background: #06080F;
      position: relative; overflow: hidden;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── Navigation ──────────────────────────────── */
    .slide-nav { display: flex; align-items: center; gap: 14px; }
    .nav-btn {
      width: 38px; height: 38px;
      border-radius: 8px;
      border: 1px solid rgba(99,102,241,.3);
      background: rgba(99,102,241,.08);
      color: #f8fafc; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .2s; font-family: 'DM Sans', sans-serif;
    }
    .nav-btn:hover { background: rgba(99,102,241,.25); border-color: #6366f1; }
    .nav-btn:disabled { opacity: .25; cursor: not-allowed; }
    .slide-counter { font-size: 13px; color: #64748b; min-width: 48px; text-align: center; }
    .dots { display: flex; gap: 5px; }
    .dot {
      width: 6px; height: 6px; border-radius: 3px;
      background: rgba(99,102,241,.25); transition: all .25s; cursor: pointer;
    }
    .dot.active { background: #6366f1; width: 18px; }

    /* ── Export bar ──────────────────────────────── */
    .export-bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn {
      padding: 10px 22px; border-radius: 9px; border: none;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all .2s;
    }
    .btn-primary { background: #6366f1; color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-outline { background: rgba(99,102,241,.1); color: #a5b4fc; border: 1px solid rgba(99,102,241,.3); }
    .btn-outline:hover { background: rgba(99,102,241,.2); }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── Loading overlay ─────────────────────────── */
    #loading {
      display: none; position: fixed; inset: 0;
      background: rgba(6,8,15,.85); z-index: 999;
      align-items: center; justify-content: center; flex-direction: column; gap: 14px;
    }
    #loading.show { display: flex; }
    .spinner {
      width: 38px; height: 38px;
      border: 3px solid rgba(99,102,241,.25); border-top-color: #6366f1;
      border-radius: 50%; animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-msg { font-size: 14px; color: #64748b; }

    /* ══════════════════════════════════════════════
       SLIDE STYLES — todas renderizadas dentro de
       #slide-canvas (540×540 px)
    ══════════════════════════════════════════════ */

    .s-bg {
      position: absolute; inset: 0;
      background: #06080F;
      background-image: radial-gradient(ellipse 90% 60% at 50% -5%, #1e2456 0%, #06080F 65%);
    }
    .s-bg-cta {
      position: absolute; inset: 0;
      background: linear-gradient(140deg, #1e1b4b 0%, #312e81 50%, #1e1b4b 100%);
    }
    .s-glow {
      position: absolute; width: 320px; height: 320px; border-radius: 50%;
      background: rgba(99,102,241,.3); filter: blur(90px);
      top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none;
    }

    .s-wrap {
      position: relative; z-index: 2;
      width: 100%; height: 100%;
      padding: 38px 40px;
      display: flex; flex-direction: column;
    }

    .s-logo-bar {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 24px;
      flex-shrink: 0;
    }
    .s-logo-icon {
      width: 30px; height: 30px; border-radius: 7px;
      background: #6366f1; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .s-logo-name { font-size: 14px; font-weight: 700; color: #f8fafc; letter-spacing: -.2px; }

    /* Cover */
    .s-cover-body { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
    .s-cover-title {
      font-size: 38px; font-weight: 800; line-height: 1.08;
      color: #f8fafc; letter-spacing: -1.8px;
      white-space: pre-line; margin-bottom: 14px;
    }
    .s-cover-sub { font-size: 15px; font-weight: 500; color: #a5b4fc; }
    .s-badge {
      position: absolute; top: 34px; right: 34px; z-index: 10;
      padding: 7px 15px; border-radius: 20px;
      background: #10b981; color: #fff;
      font-size: 13px; font-weight: 800; letter-spacing: .8px;
    }

    /* Body / text */
    .s-body-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 0; }
    .s-emoji { font-size: 34px; margin-bottom: 14px; }
    .s-head {
      font-size: 25px; font-weight: 800; line-height: 1.2;
      color: #f8fafc; letter-spacing: -.8px;
      white-space: pre-line; margin-bottom: 14px;
    }
    .s-head-danger { color: #fca5a5; }
    .s-head-success { color: #6ee7b7; }
    .s-hr { height: 1px; background: rgba(99,102,241,.2); margin: 2px 0 14px; }
    .s-text { font-size: 14.5px; font-weight: 400; line-height: 1.68; color: #94a3b8; }

    /* List */
    .s-list { display: flex; flex-direction: column; gap: 11px; margin-top: 6px; }
    .s-list-row { display: flex; align-items: center; gap: 11px; font-size: 14.5px; font-weight: 500; color: #f8fafc; }
    .s-check {
      width: 22px; height: 22px; border-radius: 6px; flex-shrink: 0;
      background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: #6ee7b7;
    }

    /* Problem */
    .s-problem-label {
      font-size: 10.5px; font-weight: 700; letter-spacing: 1.8px;
      text-transform: uppercase; color: #64748b; margin-bottom: 10px;
    }
    .s-problem-badge {
      display: inline-block; padding: 4px 12px; border-radius: 20px; margin-bottom: 14px;
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3);
      font-size: 12px; font-weight: 600; color: #fca5a5;
    }

    /* Module */
    .s-mod-num {
      position: absolute; right: 36px; top: 30px; z-index: 1;
      font-size: 72px; font-weight: 800; line-height: 1;
      color: rgba(99,102,241,.12); letter-spacing: -4px;
    }
    .s-mod-icon { font-size: 30px; margin-bottom: 10px; }
    .s-features { display: flex; flex-direction: column; gap: 9px; margin-top: 10px; }
    .s-feature { display: flex; align-items: flex-start; gap: 9px; font-size: 13.5px; color: #94a3b8; line-height: 1.4; }
    .s-dot-ind { width: 5px; height: 5px; border-radius: 3px; background: #6366f1; margin-top: 7px; flex-shrink: 0; }

    /* CTA */
    .s-cta-inner {
      position: relative; z-index: 2;
      width: 100%; height: 100%;
      padding: 44px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; gap: 14px;
    }
    .s-cta-title {
      font-size: 36px; font-weight: 800; line-height: 1.1;
      color: #f8fafc; letter-spacing: -1.4px; white-space: pre-line;
    }
    .s-cta-sub { font-size: 14px; color: #a5b4fc; line-height: 1.55; white-space: pre-line; }
    .s-cta-btn {
      padding: 12px 28px; background: #10b981; color: #fff;
      border-radius: 10px; font-size: 16px; font-weight: 700;
      letter-spacing: -.2px; margin-top: 6px;
    }

    /* Comparison */
    .s-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; margin-top: 8px; }
    .s-col { border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 7px; }
    .s-col-free { background: rgba(15,23,42,.8); border: 1px solid rgba(255,255,255,.07); }
    .s-col-pro  { background: rgba(99,102,241,.12); border: 1px solid rgba(99,102,241,.4); }
    .s-col-title { font-size: 12px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 4px; }
    .s-col-item { display: flex; align-items: flex-start; gap: 7px; font-size: 12.5px; color: #f8fafc; line-height: 1.35; }

    /* Steps */
    .s-steps { display: flex; flex-direction: column; gap: 14px; flex: 1; justify-content: center; margin-top: 6px; }
    .s-step { display: flex; align-items: center; gap: 16px; }
    .s-step-num {
      width: 42px; height: 42px; border-radius: 11px; flex-shrink: 0;
      background: rgba(99,102,241,.18); border: 1px solid rgba(99,102,241,.45);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; font-weight: 800; color: #a5b4fc;
    }
    .s-step-text { font-size: 16px; font-weight: 600; color: #f8fafc; }

    /* Quote */
    .s-quote-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; }
    .s-q-mark { font-size: 68px; line-height: .8; color: rgba(99,102,241,.35); font-family: Georgia, serif; }
    .s-q-text { font-size: 22px; font-weight: 700; line-height: 1.35; color: #f8fafc; letter-spacing: -.4px; }
    .s-q-sub { font-size: 13.5px; color: #94a3b8; line-height: 1.55; }
  </style>
</head>
<body>

  <div class="header">
    <svg viewBox="0 0 100 100" width="42" height="42">
      <rect width="100" height="100" rx="14" fill="#6366f1"/>
      <rect x="44" y="18" width="12" height="64" fill="white"/>
      <rect x="22" y="44" width="56" height="12" fill="white"/>
    </svg>
    <div class="header-text">
      <h1>Ovile — Carrosséis Instagram</h1>
      <p>6 carrosséis de pré-lançamento · PNG 1080×1080</p>
    </div>
  </div>

  <div class="carousel-tabs" id="tabs"></div>

  <div class="slide-area">
    <div class="slide-wrapper">
      <div id="slide-canvas"></div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:10px;width:100%">
      <div class="slide-nav">
        <button class="nav-btn" id="btn-prev">←</button>
        <span class="slide-counter" id="counter">1 / 6</span>
        <button class="nav-btn" id="btn-next">→</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>

    <div class="export-bar">
      <button class="btn btn-primary" id="btn-one">↓ Exportar slide atual</button>
      <button class="btn btn-outline" id="btn-all">↓ Exportar todos os slides</button>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <p id="loading-msg">Exportando...</p>
  </div>

<script>
/* ── LOGO SVG ──────────────────────────────────────────── */
const LOGO = () => `<svg viewBox="0 0 100 100" width="18" height="18">
  <rect width="100" height="100" rx="10" fill="white" opacity=".9"/>
  <rect x="44" y="18" width="12" height="64" fill="#6366f1"/>
  <rect x="22" y="44" width="56" height="12" fill="#6366f1"/>
</svg>`;

const LOGO_BAR = () => `
  <div class="s-logo-bar">
    <div class="s-logo-icon">${LOGO()}</div>
    <span class="s-logo-name">Ovile</span>
  </div>`;

/* ── RENDERERS ─────────────────────────────────────────── */

function rCover(s) {
  return `
    <div class="s-bg"></div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-cover-body">
        <div class="s-cover-title">${s.title}</div>
        <div class="s-cover-sub">${s.sub}</div>
      </div>
    </div>`;
}

function rCoverFree(s) {
  return `
    <div class="s-bg"></div>
    <div class="s-badge">${s.badge}</div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-cover-body">
        <div class="s-cover-title">${s.title}</div>
        <div class="s-cover-sub" style="white-space:pre-line">${s.sub}</div>
      </div>
    </div>`;
}

function rBody(s) {
  return `
    <div class="s-bg"></div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-body-wrap">
        ${s.icon ? `<div class="s-emoji">${s.icon}</div>` : ''}
        <div class="s-head">${s.head}</div>
        <div class="s-hr"></div>
        <div class="s-text">${s.body}</div>
      </div>
    </div>`;
}

function rList(s) {
  const rows = s.items.map(i => `
    <div class="s-list-row">
      <div class="s-check">✓</div>
      <span>${i}</span>
    </div>`).join('');
  return `
    <div class="s-bg"></div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-body-wrap">
        <div class="s-head">${s.head}</div>
        <div class="s-list">${rows}</div>
      </div>
    </div>`;
}

function rProblem(s) {
  return `
    <div class="s-bg"></div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-body-wrap">
        <div class="s-problem-label">Problema ${s.num} de 5</div>
        <div class="s-problem-badge">❌ Situação comum</div>
        <div class="s-head s-head-danger">${s.head}</div>
        <div class="s-hr"></div>
        <div class="s-text">${s.body}</div>
      </div>
    </div>`;
}

function rSolution(s) {
  const rows = s.items.map(i => `
    <div class="s-list-row">
      <div class="s-check">✓</div>
      <span>${i}</span>
    </div>`).join('');
  return `
    <div class="s-bg"></div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-body-wrap">
        <div class="s-head s-head-success">${s.head}</div>
        <div class="s-list">${rows}</div>
      </div>
    </div>`;
}

function rModule(s) {
  const feats = s.items.map(i => `
    <div class="s-feature">
      <div class="s-dot-ind"></div>
      <span>${i}</span>
    </div>`).join('');
  return `
    <div class="s-bg"></div>
    <div class="s-mod-num">${s.num}</div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-body-wrap">
        <div class="s-mod-icon">${s.icon}</div>
        <div class="s-head" style="font-size:23px">${s.head}</div>
        <div class="s-features">${feats}</div>
      </div>
    </div>`;
}

function rCta(s) {
  const logoSvg = `<svg viewBox="0 0 100 100" width="44" height="44" style="margin-bottom:4px">
    <rect width="100" height="100" rx="14" fill="rgba(255,255,255,.15)"/>
    <rect x="44" y="18" width="12" height="64" fill="white"/>
    <rect x="22" y="44" width="56" height="12" fill="white"/>
  </svg>`;
  return `
    <div class="s-bg-cta"></div>
    <div class="s-glow"></div>
    <div class="s-cta-inner">
      ${logoSvg}
      <div class="s-cta-title">${s.title}</div>
      ${s.sub ? `<div class="s-cta-sub">${s.sub}</div>` : ''}
      <div class="s-cta-btn">👉 ${s.link}</div>
    </div>`;
}

function rComparison(s) {
  const fi = s.free_items.map(i => `
    <div class="s-col-item"><span style="color:#6ee7b7;flex-shrink:0">✓</span><span>${i}</span></div>`).join('');
  const pi = s.pro_items.map(i => `
    <div class="s-col-item"><span style="color:#a5b4fc;flex-shrink:0">✓</span><span>${i}</span></div>`).join('');
  return `
    <div class="s-bg"></div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-head" style="font-size:21px;margin-bottom:0">E quando sua igreja crescer?</div>
      <div class="s-compare">
        <div class="s-col s-col-free">
          <div class="s-col-title" style="color:#6ee7b7">FREE</div>
          ${fi}
        </div>
        <div class="s-col s-col-pro">
          <div class="s-col-title" style="color:#a5b4fc">PRO</div>
          ${pi}
        </div>
      </div>
    </div>`;
}

function rSteps(s) {
  const steps = s.steps.map(st => `
    <div class="s-step">
      <div class="s-step-num">${st.n}</div>
      <div class="s-step-text">${st.text}</div>
    </div>`).join('');
  return `
    <div class="s-bg"></div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-body-wrap">
        <div class="s-head">${s.head}</div>
        <div class="s-steps">${steps}</div>
      </div>
    </div>`;
}

function rQuote(s) {
  return `
    <div class="s-bg"></div>
    <div class="s-wrap">
      ${LOGO_BAR()}
      <div class="s-quote-wrap">
        <div class="s-q-mark">"</div>
        <div class="s-q-text">${s.text}"</div>
        <div class="s-hr"></div>
        <div class="s-q-sub">${s.sub}</div>
      </div>
    </div>`;
}

function renderSlide(slide) {
  switch (slide.type) {
    case 'cover':       return rCover(slide);
    case 'cover_free':  return rCoverFree(slide);
    case 'body':        return rBody(slide);
    case 'list':        return rList(slide);
    case 'problem':     return rProblem(slide);
    case 'solution':    return rSolution(slide);
    case 'module':      return rModule(slide);
    case 'cta':         return rCta(slide);
    case 'comparison':  return rComparison(slide);
    case 'steps':       return rSteps(slide);
    case 'quote':       return rQuote(slide);
    default: return '<div style="color:red;padding:20px">Tipo desconhecido</div>';
  }
}

/* ── DATA ──────────────────────────────────────────────── */

const DATA = [
  {
    id: 1, name: "01 · Apresentação",
    slug: "apresentacao",
    slides: [
      { type:'cover', title:'Sua igreja\nmerece mais\ndo que uma\nplanilha.', sub:'Conheça a Ovile →' },
      { type:'body', icon:'🙏', head:'Gerir uma igreja\né uma missão sagrada.', body:'Mas quando a administração vira caos — membros perdidos, finanças confusas, frequência no zero — a missão fica mais difícil.' },
      { type:'body', icon:'✨', head:'Ovile nasceu\npara isso.', body:'Um sistema completo, feito especificamente para igrejas. Tudo em um lugar. Simples, seguro e acessível.' },
      { type:'list', head:'O que você\nencontra aqui:', items:['👥 Gestão de membros e cadastros','💰 Controle financeiro completo','📅 Eventos, calendário e presença','👕 Congressos e camisetas','⛪ Ministérios e departamentos'] },
      { type:'body', icon:'🎯', head:'Para quem\né a Ovile?', body:'Para o pastor que ainda anota tudo no caderno. Para o secretário que perdeu o controle da planilha. Para o líder que quer profissionalizar sem complicar.' },
      { type:'cta', title:'Comece grátis.\nSem cartão.\nSem complicação.', sub:'Até 50 membros no plano FREE.', link:'ovile.com.br' },
    ]
  },
  {
    id: 2, name: "02 · Dores",
    slug: "dores",
    slides: [
      { type:'cover', title:'5 problemas\nque toda\nigreja enfrenta\n(e têm solução).', sub:'Swipe para ver →' },
      { type:'problem', num:'1', head:'Membros\ndesaparecendo em silêncio.', body:'Você só percebe que alguém parou de vir quando já faz meses. Sem sistema, não há como rastrear frequência nem agir a tempo.' },

/* ── STATE ─────────────────────────────────────────────── */
let ci = 0, si = 0;

/* ── UI ────────────────────────────────────────────────── */
function renderTabs() {
  document.getElementById('tabs').innerHTML = DATA.map((c, i) =>
    `<button class="tab ${i===ci?'active':''}" onclick="selectC(${i})">${c.name}</button>`
  ).join('');
}

function renderDots() {
  const total = DATA[ci].slides.length;
  document.getElementById('dots').innerHTML = Array.from({length:total},(_,i) =>
    `<div class="dot ${i===si?'active':''}" onclick="goSlide(${i})"></div>`
  ).join('');
}

function renderNav() {
  const total = DATA[ci].slides.length;
  document.getElementById('counter').textContent = `${si+1} / ${total}`;
  document.getElementById('btn-prev').disabled = si === 0;
  document.getElementById('btn-next').disabled = si === total - 1;
}

function paint() {
  const slide = DATA[ci].slides[si];
  document.getElementById('slide-canvas').innerHTML = renderSlide(slide);
  renderNav();
  renderDots();
}

function selectC(i) { ci = i; si = 0; renderTabs(); paint(); }
function goSlide(i) { si = i; paint(); }

document.getElementById('btn-prev').onclick = () => { if (si > 0) { si--; paint(); } };
document.getElementById('btn-next').onclick = () => {
  if (si < DATA[ci].slides.length - 1) { si++; paint(); }
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft')  document.getElementById('btn-prev').click();
  if (e.key === 'ArrowRight') document.getElementById('btn-next').click();
});

/* ── EXPORT ────────────────────────────────────────────── */
async function captureAt(cIdx, sIdx) {
  const savedCi = ci, savedSi = si;
  ci = cIdx; si = sIdx;
  document.getElementById('slide-canvas').innerHTML = renderSlide(DATA[cIdx].slides[sIdx]);
  await new Promise(r => setTimeout(r, 120));

  const canvas = await html2canvas(document.getElementById('slide-canvas'), {
    scale: 2,
    useCORS: true,
    logging: false,
    backgroundColor: '#06080F',
    width: 540,
    height: 540,
  });

  ci = savedCi; si = savedSi;
  document.getElementById('slide-canvas').innerHTML = renderSlide(DATA[ci].slides[si]);
  renderNav(); renderDots();
  return canvas;
}

async function download(canvas, name) {
  return new Promise(resolve => {
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = Object.assign(document.createElement('a'), { href: url, download: name });
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setTimeout(resolve, 250);
    }, 'image/png');
  });
}

function setLoading(show, msg = '') {
  document.getElementById('loading').classList.toggle('show', show);
  if (msg) document.getElementById('loading-msg').textContent = msg;
}

document.getElementById('btn-one').onclick = async () => {
  const btn = document.getElementById('btn-one');
  btn.disabled = true;
  setLoading(true, 'Exportando slide...');
  try {
    const c = await captureAt(ci, si);
    await download(c, `ovile-c${DATA[ci].id}-slide${si+1}.png`);
  } catch(e) { alert('Erro: ' + e.message); }
  finally { btn.disabled = false; setLoading(false); }
};

document.getElementById('btn-all').onclick = async () => {
  const btn = document.getElementById('btn-all');
  btn.disabled = true;
  const car = DATA[ci];
  try {
    for (let i = 0; i < car.slides.length; i++) {
      setLoading(true, `Exportando ${i+1} de ${car.slides.length}...`);
      const c = await captureAt(ci, i);
      await download(c, `ovile-c${car.id}-${car.slug}-slide${i+1}.png`);
    }
  } catch(e) { alert('Erro: ' + e.message); }
  finally { btn.disabled = false; setLoading(false); }
};

/* ── INIT ──────────────────────────────────────────────── */
document.fonts.ready.then(() => { renderTabs(); paint(); });
</script>
