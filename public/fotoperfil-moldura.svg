<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!--
    Moldura da campanha (Base de Apoio André Santos 2026).
    - canvas final: 1000x1000
    - a foto do apoiador aparece através do furo central (raio ~430, centro 500,500)
    - para trocar a arte por outra versão, substitua este arquivo ou aponte
      BADGE_SRC em fotoperfil/page.tsx para o novo caminho, mantendo essas medidas.
  -->
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a9812c"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- anel dourado ao redor da foto -->
  <circle cx="500" cy="500" r="455" fill="none" stroke="url(#ringGrad)" stroke-width="50" filter="url(#softShadow)"/>

  <!-- selo (estrela) no canto inferior direito -->
  <g filter="url(#softShadow)">
    <circle cx="760" cy="760" r="85" fill="#0a1220" stroke="url(#ringGrad)" stroke-width="8"/>
    <path d="M760 706 l16.5 42 45 3 -34.5 29 11 44 -38 -25.5 -38 25.5 11 -44 -34.5 -29 45 -3 z"
          fill="url(#ringGrad)"/>
  </g>
</svg>
